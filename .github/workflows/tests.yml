name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Floor claimed by the project, plus the version exercised locally.
        # discord.py 2.7 classifiers stop at 3.12, so 3.13 is not in this matrix.
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: botkit/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r botkit/requirements.txt

      - name: Refuse a Discord token
        run: |
          if [ -n "${DISCORD_TOKEN:-}" ]; then
            echo "DISCORD_TOKEN is set. These unit tests must stay offline."
            exit 1
          fi

      - name: Kit tests
        working-directory: botkit
        run: python -m unittest discover -s tests -v

      - name: Supervisor tests
        run: python -m unittest discover -s tests -v
